name: Live ETL Smoke

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/smoke-etl.yml"

jobs:
  live-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run live ETL smoke
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FX_START_DATE: "2024-01-01"
          FX_QUOTES: "USD,GBP,EUR"
          WORLD_BANK_COUNTRY: "ZAF"
          WORLD_BANK_START_YEAR: "2018"
          WORLD_BANK_INDICATORS: "FP.CPI.TOTL.ZG,NY.GDP.MKTP.KD.ZG"
        run: python -m src.pipeline
